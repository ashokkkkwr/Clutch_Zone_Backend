version: '3.8'

services:
  database:
    image: postgres:15
    container_name: clutch_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: exoticshok1A
      POSTGRES_DB: prisma
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: clutch_backend
    restart: always
    depends_on:
      - database
    environment:
      DATABASE_URL: postgresql://postgres:exoticshok1A@database:5432/prisma
      NODE_ENV: production
      PORT: 5000
    ports:
      - "5000:5000"

volumes:
  postgres_data:
